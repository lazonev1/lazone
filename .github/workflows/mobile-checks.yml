name: Mobile checks

on:
  pull_request:
  push:
    branches:
      - develop
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter ./apps/mobile lint
      - run: pnpm --filter ./apps/mobile typecheck
      - run: cd apps/mobile && pnpm dlx firebase-tools@15.5.1 emulators:exec --project demo-rules --only firestore,auth "pnpm test:rules"
      - run: node --check apps/mobile/backend/main/src/functions/index.js
